# Conda environment for tablescrape on iTiger.  setup.sh creates it:  conda env create -f environment.yml
#
# torch 2.6.0 built for CUDA 12.4: the iTiger docs warn that newer default PyTorch wheels need a newer NVIDIA driver
# than the cluster has, and then silently fall back to the CPU. torchvision 0.21.0 is the release that matches torch
# 2.6.0 (Qwen3-VL's processor needs it). transformers 4.57.6 is the last 4.x release; it supports Qwen3-VL and
# Qwen2.5-VL and still works with torch 2.6.
name: tablescrape
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - tesseract=5.3.4   # the OCR program (second reader for tables pasted as pictures); optional at run time
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0
      - torchvision==0.21.0
      - transformers==4.57.6
      - accelerate>=1.2,<2
      - huggingface_hub>=0.34,<1.0
      - pypdfium2>=4.30
      - pillow>=10
      - openpyxl>=3.1
      - json-repair>=0.30
      - pytesseract>=0.3.10
